# nginx.conf (Example for your Dockerfile)
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Set root to Laravel's public directory
    root /var/www/html/public;

    # Add index.php to the list if you are using PHP
    index index.php index.html index.htm;

    server_name _; # Catch all hostnames

    location / {
        # Try static files first, then fallback to index.php
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP scripts to FastCGI server (PHP-FPM)
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # Use 127.0.0.1:9000 since PHP-FPM is in the same container
        # The php:fpm images typically listen on port 9000 by default
        fastcgi_pass 127.0.0.1:9000;

        fastcgi_index index.php;
        include fastcgi_params;
        # Set the SCRIPT_FILENAME param REQUIRED by PHP-FPM
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
        expires max;
        log_not_found off;
        access_log off;
    }

    # Deny access to .htaccess files
    location ~ /\.ht {
        deny all;
    }

    # Add logging directives if needed
    # access_log /var/log/nginx/access.log;
    # error_log /var/log/nginx/error.log;
}