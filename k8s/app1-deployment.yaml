apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-app1
  namespace: laravel-apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: laravel-app1
  template:
    metadata:
      labels:
        app: laravel-app1
    spec:
      containers:
      - name: laravel-app1
        image: laravel-app1:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: APP_ENV
          value: "local"
        volumeMounts:
        - name: app-source
          mountPath: /var/www/html
      volumes:
      - name: app-source
        hostPath:
          path: /app1
          type: Directory 